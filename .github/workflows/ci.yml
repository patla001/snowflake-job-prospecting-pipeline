name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (Airflow DAG smoke tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-airflow.txt
      - name: Install Airflow + provider deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-airflow.txt
      - name: Run pytest
        env:
          AIRFLOW_HOME: ${{ github.workspace }}
        run: python -m pytest tests/ -v

  dbt:
    name: dbt parse + deps (Snowflake adapter, no connection)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dbt-snowflake
        run: |
          python -m pip install --upgrade pip
          pip install 'dbt-core>=1.8,<2' 'dbt-snowflake>=1.8,<2'
      - name: dbt deps
        working-directory: dbt
        run: dbt deps --profiles-dir .
      - name: dbt parse
        working-directory: dbt
        env:
          # parse doesn't connect, but env_var() must be resolvable at template-render time
          SNOWSQL_PWD: ci-dummy-value-not-used
        run: dbt parse --profiles-dir .
